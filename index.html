<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Mini Stack Overflow - A simple question and answer platform"
    >

    <title>Mini Stack Overflow</title>

    <!-- Connect HTML with CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="top-header">

        <div class="logo">
            Mini<span>Overflow</span>
        </div>

        <!-- Search box -->
        <div class="search-container">
            <input
                type="text"
                id="searchInput"
                placeholder="Search questions..."
                aria-label="Search questions"
            >
        </div>

    </header>


    <!-- ================= MAIN LAYOUT ================= -->
    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <nav>
                <a href="#" class="active">🏠 Home</a>
                <a href="#questions">❓ Questions</a>
                <a href="#tags">🏷️ Tags</a>
            </nav>

        </aside>


        <!-- Main content -->
        <main class="main-content">

            <!-- Page heading -->
            <section class="page-header">

                <div>
                    <h1>All Questions</h1>

                    <p>
                        Ask questions, share knowledge and help others.
                    </p>
                </div>

                <button id="askQuestionBtn" class="primary-btn">
                    Ask Question
                </button>

            </section>


            <!-- Question statistics -->
            <section class="stats">

                <div class="stat-box">
                    <strong id="questionCount">0</strong>
                    <span>Questions</span>
                </div>

                <div class="stat-box">
                    <strong id="answerCount">0</strong>
                    <span>Answers</span>
                </div>

                <div class="stat-box">
                    <strong id="voteCount">0</strong>
                    <span>Votes</span>
                </div>

            </section>


            <!-- Questions will be inserted here by JavaScript -->
            <section id="questions" class="questions-list"></section>

        </main>

    </div>


    <!-- ================= ASK QUESTION MODAL ================= -->

    <div id="questionModal" class="modal hidden">

        <div class="modal-content">

            <button
                id="closeModal"
                class="close-btn"
                aria-label="Close"
            >
                ×
            </button>

            <h2>Ask a Question</h2>

            <form id="questionForm">

                <label for="questionTitle">
                    Question Title
                </label>

                <input
                    type="text"
                    id="questionTitle"
                    placeholder="e.g. How do I learn JavaScript?"
                    required
                >


                <label for="questionDescription">
                    Description
                </label>

                <textarea
                    id="questionDescription"
                    placeholder="Explain your question..."
                    required
                ></textarea>


                <label for="questionTags">
                    Tags
                </label>

                <input
                    type="text"
                    id="questionTags"
                    placeholder="javascript, html, css"
                    required
                >

                <button type="submit" class="primary-btn">
                    Post Question
                </button>

            </form>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
